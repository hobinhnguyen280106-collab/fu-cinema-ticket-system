<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Phòng chiếu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between mb-3">
        <h3>Quản lý Phòng chiếu</h3>
        <a class="btn btn-primary" th:href="@{/admin/rooms/new}">+ Thêm phòng</a>
    </div>
    <table class="table table-hover align-middle">
        <thead class="table-light">
            <tr>
                <th>Tên phòng</th>
                <th>Loại</th>
                <th>Sơ đồ</th>
                <th>Sức chứa</th>
                <th>Trạng thái</th>
                <th class="text-end">Hành động</th>
            </tr>
        </thead>
        <tbody>
        <tr th:if="${rooms.empty}">
            <td colspan="6" class="text-center text-muted">Chưa có phòng chiếu nào</td>
        </tr>
        <tr th:each="r : ${rooms}">
            <td class="fw-bold" th:text="${r.roomName}"></td>
            <td><span class="badge bg-secondary" th:text="${r.roomType.label}"></span></td>
            <td th:text="|${r.totalRows} hàng × ${r.seatsPerRow} ghế|"></td>
            <td th:text="|${r.capacity} chỗ|"></td>
            <td>
                <span th:if="${r.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                <span th:if="${r.status.name() == 'MAINTENANCE'}" class="badge bg-warning text-dark">MAINTENANCE</span>
            </td>
            <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/rooms/{id}/edit(id=${r.roomId})}">Sửa</a>
                <form class="d-inline" method="post" th:action="@{/admin/rooms/{id}/delete(id=${r.roomId})}"
                      onsubmit="return confirm('Xoá phòng? Nếu đã có suất chiếu, phòng sẽ chuyển sang MAINTENANCE.');">
                    <button class="btn btn-sm btn-outline-danger">Xoá</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

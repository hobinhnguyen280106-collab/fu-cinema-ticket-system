spring.application.name=fu-cinema-ticket-system

# Profile "local" ch?a thông tin k?t n?i DB (file application-local.properties KHÔNG commit)
spring.profiles.active=local

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# SQL Server: String -> NVARCHAR ?? l?u ti?ng Vi?t có d?u (m?c ??nh Hibernate dùng VARCHAR)
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Thymeleaf
spring.thymeleaf.cache=false

# Hi?n th? trang l?i tu? bi?n, không l? stack trace
spring.server.error.include-stacktrace=never
spring.server.error.whitelabel.enabled=false